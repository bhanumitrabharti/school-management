<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shishu Vikash Mandir - Super Admin SaaS Control Center for managing school tenants.">
  <title>Super Admin Portal - SaaS Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.sa-body {
      font-family: 'Inter', sans-serif;
      background: #0a0a14;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .sa-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a14 0%, #1a1a2e 50%, #0f0f1a 100%);
    }

    .sa-login-bg-shapes {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    }

    .sa-login-bg-shapes .shape {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
      animation: saFloat 20s ease-in-out infinite;
    }

    .sa-login-bg-shapes .shape-1 { width: 400px; height: 400px; background: #7c3aed; top: -100px; right: -100px; }
    .sa-login-bg-shapes .shape-2 { width: 350px; height: 350px; background: #06b6d4; bottom: -80px; left: -80px; animation-delay: -5s; }
    .sa-login-bg-shapes .shape-3 { width: 300px; height: 300px; background: #f59e0b; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -10s; }

    @keyframes saFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.02); }
    }

    .sa-login-card {
      background: rgba(26, 26, 46, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
      padding: 48px 40px; width: 100%; max-width: 440px; position: relative; z-index: 2;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    }

    .sa-login-logo { text-align: center; margin-bottom: 32px; }
    .sa-login-logo img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; border: 2px solid rgba(124, 58, 237, 0.4); box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2); }
    .sa-login-logo h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-top: 16px; }
    .sa-login-logo p { color: rgba(255, 255, 255, 0.5); font-size: 13px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

    .sa-form-group { margin-bottom: 20px; }
    .sa-form-label { display: block; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sa-input-wrapper { position: relative; display: flex; align-items: center; }
    .sa-input-wrapper .input-icon { position: absolute; left: 14px; color: rgba(255, 255, 255, 0.3); font-size: 20px; pointer-events: none; }
    .sa-form-input { width: 100%; padding: 14px 14px 14px 48px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #e2e8f0; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.2s ease; outline: none; }
    .sa-form-input:focus { border-color: #7c3aed; background: rgba(124, 58, 237, 0.06); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }

    .sa-password-wrapper { position: relative; }
    .sa-password-wrapper .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255, 255, 255, 0.4); font-size: 16px; transition: color 0.2s; z-index: 2; }
    .sa-password-wrapper .toggle-password:hover { color: #a78bfa; }

    .sa-btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; font-family: 'Inter', sans-serif; margin-top: 8px; }
    .sa-btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4); }
    .sa-login-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 12px; display: none; }

    .sa-dashboard { display: none; min-height: 100vh; }
    .sa-dashboard.visible { display: block; }

    .sa-header { background: rgba(26, 26, 46, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .sa-header-left { display: flex; align-items: center; gap: 16px; }
    .sa-header-left img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
    .sa-header-left h2 { font-size: 18px; font-weight: 700; color: #e2e8f0; }
    .sa-header-left span { font-size: 11px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 1px; }
    .sa-header-right { display: flex; align-items: center; gap: 12px; }

    .sa-btn { padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; font-family: 'Inter', sans-serif; border: none; }
    .sa-btn-primary { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; }
    .sa-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35); }
    .sa-btn-secondary { background: rgba(255, 255, 255, 0.06); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
    .sa-btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .sa-btn-danger { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2) !important; }
    .sa-btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    .sa-btn-xs { padding: 6px 12px; font-size: 11px; border-radius: 8px; }
    .sa-btn-sm { padding: 8px 16px; font-size: 12px; }

    .sa-content { padding: 32px; max-width: 1400px; margin: 0 auto; }
    .sa-section-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
    .sa-section-title .material-icons-round { color: #7c3aed; font-size: 24px; }

    .sa-action-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .sa-search-wrapper { position: relative; width: 300px; }
    .sa-search-wrapper input { width: 100%; padding: 10px 14px 10px 40px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #e2e8f0; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
    .sa-search-wrapper input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }
    .sa-search-wrapper .material-icons-round { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.3); font-size: 18px; }

    .sa-table-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; overflow: hidden; backdrop-filter: blur(12px); }
    .sa-table { width: 100%; border-collapse: collapse; }
    .sa-table thead th { padding: 14px 20px; text-align: left; font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); background: rgba(255, 255, 255, 0.02); }
    .sa-table tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; transition: background 0.15s ease; }
    .sa-table tbody tr:hover { background: rgba(124, 58, 237, 0.06); }
    .sa-table tbody td { padding: 16px 20px; font-size: 13px; vertical-align: middle; }
    .sa-school-name { font-weight: 700; color: #e2e8f0; font-size: 14px; }
    .sa-school-subdomain { font-size: 11px; color: rgba(255, 255, 255, 0.4); font-family: monospace; margin-top: 2px; }
    .sa-school-tagline { font-size: 11px; color: rgba(255, 255, 255, 0.35); font-style: italic; margin-top: 2px; }

    .sa-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .sa-badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
    .sa-badge-paused { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    .sa-badge-premium { background: rgba(124, 58, 237, 0.15); color: #a78bfa; border: 1px solid rgba(124, 58, 237, 0.25); }
    .sa-badge-pro { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.25); }
    .sa-badge-basic { background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }

    .sa-expand-row { display: none; background: rgba(124, 58, 237, 0.04); border-left: 3px solid #7c3aed; }
    .sa-expand-row.expanded { display: table-row; }
    .sa-expand-content { padding: 24px 28px; }
    .sa-expand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 16px; }
    .sa-expand-section h4 { font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .sa-feature-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .sa-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(124, 58, 237, 0.12); color: #a78bfa; border: 1px solid rgba(124, 58, 237, 0.2); }
    .sa-stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    .sa-stat-row:last-child { border-bottom: none; }
    .sa-stat-label { color: rgba(255, 255, 255, 0.5); }
    .sa-stat-value { color: #e2e8f0; font-weight: 600; }

    .sa-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 24px; }
    .sa-modal-overlay.visible { display: flex; }
    .sa-modal { background: #1a1a2e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6); animation: saModalSlideIn 0.25s ease-out; }
    @keyframes saModalSlideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sa-modal-header { padding: 24px 28px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; }
    .sa-modal-header h3 { font-size: 18px; font-weight: 700; }
    .sa-modal-close { background: none; border: none; color: rgba(255, 255, 255, 0.4); cursor: pointer; font-size: 24px; padding: 4px; transition: color 0.2s; }
    .sa-modal-close:hover { color: #f87171; }
    .sa-modal-body { padding: 24px 28px; }
    .sa-modal-footer { padding: 16px 28px 24px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .sa-modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .sa-modal-form-grid .full-width { grid-column: 1 / -1; }
    .sa-modal-form-group { display: flex; flex-direction: column; gap: 6px; }
    .sa-modal-form-group label { font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 0.5px; }
    .sa-modal-form-group input, .sa-modal-form-group select, .sa-modal-form-group textarea { padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #e2e8f0; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
    .sa-modal-form-group input:focus, .sa-modal-form-group select:focus, .sa-modal-form-group textarea:focus { border-color: #7c3aed; }
    .sa-modal-form-group select option { background: #1a1a2e; color: #e2e8f0; }
    .sa-features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .sa-feature-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; cursor: pointer; transition: all 0.15s ease; font-size: 12px; color: rgba(255, 255, 255, 0.6); }
    .sa-feature-toggle:hover { border-color: rgba(124, 58, 237, 0.3); background: rgba(124, 58, 237, 0.06); }
    .sa-feature-toggle input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: #7c3aed; }

    .sa-toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
    .sa-toast { padding: 14px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #fff; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); animation: saToastIn 0.3s ease-out; display: flex; align-items: center; gap: 10px; }
    .sa-toast.success { background: rgba(16, 185, 129, 0.9); }
    .sa-toast.error { background: rgba(239, 68, 68, 0.9); }
    .sa-toast.info { background: rgba(124, 58, 237, 0.9); }
    @keyframes saToastIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .sa-actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

    @media (max-width: 768px) {
      .sa-content { padding: 20px 16px; }
      .sa-header { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
      .sa-expand-grid { grid-template-columns: 1fr; }
      .sa-modal-form-grid { grid-template-columns: 1fr; }
      .sa-features-grid { grid-template-columns: 1fr; }
      .sa-search-wrapper { width: 100%; }
      .sa-action-bar { flex-direction: column; align-items: stretch; }
      .sa-login-card { margin: 16px; padding: 32px 24px; }
    }
  </style>
</head>
<body class="sa-body">

  <!-- ==================== LOGIN PAGE ==================== -->
  <div id="sa-login-page" class="sa-login-page">
    <div class="sa-login-bg-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    <div class="sa-login-card">
      <div class="sa-login-logo">
        <img src="./school-logo-updated.jpg" alt="Logo">
        <h1>Super Admin Portal</h1>
        <p>SaaS Control Center</p>
      </div>
      <form id="sa-login-form">
        <div class="sa-form-group">
          <label class="sa-form-label" for="sa-username">Username</label>
          <div class="sa-input-wrapper">
            <span class="material-icons-round input-icon">person</span>
            <input type="text" id="sa-username" class="sa-form-input" placeholder="Enter username" autocomplete="username">
          </div>
        </div>
        <div class="sa-form-group">
          <label class="sa-form-label" for="sa-password">Password</label>
          <div class="sa-input-wrapper sa-password-wrapper">
            <span class="material-icons-round input-icon">lock</span>
            <input type="password" id="sa-password" class="sa-form-input" placeholder="Enter password" autocomplete="current-password" style="padding-right: 44px;">
            <i class="fa fa-eye toggle-password" id="sa-toggle-pwd"></i>
          </div>
        </div>
        <button type="submit" class="sa-btn-login">
          <span class="material-icons-round">security</span>
          Sign In to Control Center
        </button>
        <div class="sa-login-error" id="sa-login-error">Invalid credentials. Please try again.</div>
      </form>
    </div>
  </div>

  <!-- ==================== DASHBOARD ==================== -->
  <div id="sa-dashboard" class="sa-dashboard">
    <header class="sa-header">
      <div class="sa-header-left">
        <img src="./school-logo-updated.jpg" alt="Logo">
        <div>
          <h2>Super Admin Portal</h2>
          <span>SaaS Control Center</span>
        </div>
      </div>
      <div class="sa-header-right">
        <button class="sa-btn sa-btn-secondary sa-btn-sm" id="sa-link-erp" title="Open Tenant ERP">
          <span class="material-icons-round" style="font-size:16px;">open_in_new</span>
          Tenant ERP
        </button>
        <button class="sa-btn sa-btn-danger sa-btn-sm" id="sa-logout-btn">
          <span class="material-icons-round" style="font-size:16px;">logout</span>
          Logout
        </button>
      </div>
    </header>

    <div class="sa-content">
      <div class="sa-section-title">
        <span class="material-icons-round">dashboard</span>
        Dashboard Overview
      </div>
      <div class="sa-metrics-grid" id="sa-metrics"></div>

      <div class="sa-action-bar">
        <div class="sa-section-title" style="margin-bottom:0;">
          <span class="material-icons-round">corporate_fare</span>
          School Directory
        </div>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <div class="sa-search-wrapper">
            <span class="material-icons-round">search</span>
            <input type="text" id="sa-search" placeholder="Search schools...">
          </div>
          <button class="sa-btn sa-btn-primary sa-btn-sm" id="sa-add-school-btn">
            <span class="material-icons-round" style="font-size:16px;">add</span>
            Onboard School
          </button>
        </div>
      </div>

      <div class="sa-table-card">
        <table class="sa-table">
          <thead>
            <tr>
              <th>School Info</th>
              <th>Plan & Storage</th>
              <th>Status</th>
              <th>Last Activity</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="sa-schools-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="sa-modal-overlay" class="sa-modal-overlay">
    <div class="sa-modal">
      <div class="sa-modal-header">
        <h3 id="sa-modal-title">Add School</h3>
        <button class="sa-modal-close" id="sa-modal-close-btn">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div class="sa-modal-body" id="sa-modal-body"></div>
      <div class="sa-modal-footer" id="sa-modal-footer"></div>
    </div>
  </div>

  <div class="sa-toast-container" id="sa-toast-container"></div>

  <script src="js/super-admin.js"></script>
</body>
</html>
